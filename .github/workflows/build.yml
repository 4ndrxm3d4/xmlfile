name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Configure (Windows x64)
        run: |
          mkdir build_win
          cd build_win
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++

      - name: Build (Windows x64)
        run: cmake --build build_win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmlfile-windows-x64
          path: build_win/xmlfile.exe

  build-android-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Android aarch64)
        run: |
          mkdir build_android
          cd build_android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21

      - name: Build (Android aarch64)
        run: cmake --build build_android

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmlfile-android-aarch64
          path: build_android/xmlfile
